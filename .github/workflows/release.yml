name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # change to 9.0.x or 10.0.x if you changed TargetFramework
      - name: Publish
        run: dotnet publish AllWebHubHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out
      - name: Zip
        run: Compress-Archive -Path out\* -DestinationPath AllWebHubHub-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AllWebHubHub-win-x64
          path: AllWebHubHub-win-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AllWebHubHub-win-x64.zip
